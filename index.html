<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/studio.css" />
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <symbol id="hanger" viewBox="0 0 400 140">
        <path d="M200 70V46c0-10 14-12 14-26S186 4 184 20" fill="none" stroke="#b08a4e" stroke-width="6" stroke-linecap="round" />
        <path d="M200 64c-10 0-170 40-186 54-8 8-2 12 10 12h352c12 0 18-4 10-12-16-14-176-54-186-54Z" fill="#5f4029" />
        <path d="M200 64c-10 0-170 40-186 54-2 2-3 4-3 5 40-14 150-44 189-44s149 30 189 44c0-1-1-3-3-5-16-14-176-54-186-54Z" fill="#8a6443" />
      </symbol>
      <symbol id="hook" viewBox="0 0 60 64">
        <path d="M30 64V30c0-8 11-10 11-19S21 2 19 13" fill="none" stroke="#8a6443" stroke-width="3.5" stroke-linecap="round" />
      </symbol>
      <!-- A quarter of a ring around the stand, in the stand image's pixels. -->
      <symbol id="turn-arc" viewBox="-96 0 696 673">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <g class="turn-track">
            <path d="M465 623A650 300 0 0 1-28 408" />
            <path d="M-34 478L-28 408 35 437" />
          </g>
          <g class="turn-line">
            <path d="M465 623A650 300 0 0 1-28 408" />
            <path d="M-34 478L-28 408 35 437" />
          </g>
        </g>
      </symbol>
      <symbol id="clips" viewBox="0 0 200 64">
        <path d="M100 38V30c0-8 11-10 11-19S91 2 89 13" fill="none" stroke="#8a6443" stroke-width="3.5" stroke-linecap="round" />
        <path d="M18 38h164" stroke="#8a6443" stroke-width="4" stroke-linecap="round" />
        <rect x="26" y="36" width="20" height="28" rx="3" fill="#5f4029" />
        <rect x="154" y="36" width="20" height="28" rx="3" fill="#5f4029" />
      </symbol>
    </svg>
    <main id="stage">
      <img class="plate" id="plate-a" alt="" />
      <img class="plate" id="plate-b" alt="" />
      <div class="figure" id="figure">
        <span class="ground"></span>
        <img class="stand" id="stand-a" alt="" draggable="false" />
        <img class="stand" id="stand-b" alt="" draggable="false" />
        <span class="contact"></span>
        <div class="turntable">
          <button type="button" class="turn" id="turn-left" aria-label="Turn left"><svg aria-hidden="true"><use href="#turn-arc" /></svg></button>
          <button type="button" class="turn" id="turn-right" aria-label="Turn right"><svg aria-hidden="true"><use href="#turn-arc" /></svg></button>
        </div>
        <div class="body" id="body" role="img" aria-label="Mannequin on a stand wearing the selected look.">
          <img class="frame" id="frame-a" alt="" draggable="false" />
          <img class="frame" id="frame-b" alt="" draggable="false" />
        </div>
        <img class="frame reveal" id="reveal" alt="" draggable="false" hidden />
        <div class="loader" id="loader" role="status" aria-label="Muse is dressing the look" hidden>
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="loader-track" cx="50" cy="50" r="47" />
            <circle class="loader-done" id="loader-done" cx="50" cy="50" r="47" pathLength="1" />
            <g id="loader-needle"><circle class="loader-needle" cx="50" cy="3" r="2.4" /></g>
          </svg>
          <span class="loader-hanger"><svg aria-hidden="true"><use href="#hanger" /></svg></span>
          <p class="loader-step" id="loader-step"></p>
        </div>
      </div>
    </main>

    <header>
      <h1>Orbit</h1>
      <p id="place-name"></p>
    </header>

    <nav class="places" id="places" aria-label="Places"></nav>
